<!DOCTYPE html>
<html>
<head>
    <title>Board</title>
</head>
<body>

<h1>Board</h1>

<h2>Create Task</h2>

<form th:action="@{'/task/create/' + ${boardId}}" method="post">

    <input type="text" name="title" placeholder="Task title">

    <button type="submit">Create Task</button>

</form>

<h2>Tasks</h2>

<ul>
    <li th:each="task : ${tasks}" th:text="${task.title}"></li>
</ul>

</body>
</html>
